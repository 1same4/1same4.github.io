  var bt=el('button','op','<span class="e"><i>'+o[0]+'</i></span><span><b>'+o[1]+'</b><small>'+o[2]+'</small></span><span class="ar">‹</span>');

  setTimeout(function(){

          ['🌐','موقع باسمك','سريع، وكل طلب يوصلك بمكان واحد.'],
          ['🎬','إعلانات بالذكاء الاصطناعي','ريلز يوقّف الناس، بلا تصوير.']]);
    chips('biz',[chip('🔍 سراج يطلعلك خطة',function(){invite('احچيلي بسطرين: شنو مشروعك؟ وشنو أكثر شي يتعبك بيه؟ وأطلعلك خطة.','مثلاً: عندي صالون بالمنصور، والحجوزات تضيع بالواتساب…')},true),
      wa('💬 احچي ويا علي','هلا علي، عندي مشروع شغّال وأريد أكبّره')]);busy=false});
  else if(k==='idea')say('حلو، كل مشروع بدا بفكرة. نحوّلها لشغل حقيقي خطوة بخطوة:',null,function(){
    list([['📊','خطة وعرض تقديمي','مرتب، ويقنع أي شريك أو داعم.'],

    chips('idea',[chip('🔍 احچيلي فكرتك',function(){invite('احچيلي فكرتك بسطرين، ومنو راح يشتريها؟ وأگلك منين تبدي.','مثلاً: أريد أفتح محل قهوة متنقل بالجامعات…')},true),
      wa('💬 احچي ويا علي','هلا علي، عندي فكرة وأريد أبديها')]);busy=false});
  else say('هلا بيك. هنا تتعلم ببلاش وتبني مهارة تنفعك:',null,function(){
    list([['🧠','دروس الذكاء الاصطناعي','من الصفر، بالعراقي، وبأدوات مجانية.','قريباً'],
          ['🌳','المبادرة الخضراء','شباب يستخدمون الذكاء الاصطناعي لخدمة بيئتهم.']]);
    chips('learn',[wa('🔔 خبّرني أول ما تنزل الدروس','هلا علي، خبّرني أول ما تنزل الدروس المجانية')]);busy=false});
  },350)}
function clean(s){return s.replace(/\*\*|^#+\s*/gm,'')}
async function ask(text,file){busy=true;clearOpts();if(!file)me(text,false);
  var body={text:text,history:history.slice(-12),file:file||null};history.push({role:'user',text:text||'[بصمة صوتية]'});
  var w=el('div','b s dots','<i></i><i></i><i></i>');log.appendChild(w);down();think(true);var full='';
  try{var r=await fetch(API+'/chat?stream=1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.ok&&r.body&&(r.headers.get('Content-Type')||'').indexOf('event-stream')>=0){
      var rd=r.body.getReader(),dec=new TextDecoder(),buf='';
      while(true){var x=await rd.read();if(x.done)break;buf+=dec.decode(x.value,{stream:true});var i;
        while((i=buf.indexOf('\n'))>=0){var line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(line.indexOf('data:')!==0)continue;
          try{var j=JSON.parse(line.slice(5));var c=(j.candidates||[])[0],ps=(c&&c.content&&c.content.parts)||[];
            var t=ps.filter(function(p){return !p.thought}).map(function(p){return p.text||''}).join('');
            if(t){full+=t;w.className='b s';w.textContent=clean(full);down()}}catch(_){}}}
      full=clean(full).trim();
      if(full){w.className='b s';w.textContent=full;history.push({role:'model',text:full});ding()}else{w.className='b s';w.textContent='صار خلل، جرّب مرة ثانية'}}
    else{var d={};try{d=await r.json()}catch(_){}w.className='b s';w.textContent=d.error||'صار خلل، جرّب مرة ثانية'}}
  catch(e){w.className='b s';w.textContent='ماكو اتصال هسه، جرّب بعد شوية أو احچي ويا علي بالواتساب'}
  think(false);busy=false;down();chips(null)}
var mic=document.getElementById('mic'),fld=document.querySelector('.field'),rv=document.getElementById('rv'),tm=document.getElementById('tm'),rec=null,chunks=[],recT=0,raf=0,mctx=null,t0=0,rb=[];
for(var q=0;q<24;q++){var bi=document.createElement('i');rv.insertBefore(bi,tm);rb.push(bi)}
function b64(b){return new Promise(function(r){var fr=new FileReader();fr.onload=function(){r(String(fr.result).split(',')[1])};fr.readAsDataURL(b)})}
function fmt(s){s=Math.round(s);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
async function wav(blob){var c=new(window.AudioContext||window.webkitAudioContext)(),buf=await c.decodeAudioData(await blob.arrayBuffer());c.close();
  var rate=16000,len=Math.round(buf.duration*rate),off=new OfflineAudioContext(1,len,rate),src=off.createBufferSource();src.buffer=buf;src.connect(off.destination);src.start();
  var out=(await off.startRendering()).getChannelData(0),v=new DataView(new ArrayBuffer(44+len*2));
  function w(o,t){for(var i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))}
  w(0,'RIFF');v.setUint32(4,36+len*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,len*2,true);
  for(var i=0;i<len;i++){var x=Math.max(-1,Math.min(1,out[i]));v.setInt16(44+i*2,x<0?x*32768:x*32767,true)}
  var N=28,pk=[],mx=0.001,step=Math.max(1,Math.floor(len/N));
  for(var k=0;k<N;k++){var m=0;for(var j=k*step;j<Math.min(len,(k+1)*step);j++)m=Math.max(m,Math.abs(out[j]));pk.push(m);mx=Math.max(mx,m)}
  return{blob:new Blob([v],{type:'audio/wav'}),sec:buf.duration,peaks:pk.map(function(x){return x/mx})}}
function voiceBubble(url,sec,pk){var b=el('div','b u vo'),bars='';
  (pk&&pk.length?pk:new Array(28).fill(.4)).forEach(function(x){bars+='<i style="height:'+Math.round(5+x*20)+'px"></i>'});
  var v=el('div','vn','<button type="button" aria-label="تشغيل">▶</button><span class="wf">'+bars+'</span><small>'+fmt(sec)+'</small>'),bt=v.firstChild,bs=v.querySelectorAll('.wf i'),au=new Audio(url);
  bt.onclick=function(){if(au.paused){au.play();bt.textContent='❚❚'}else{au.pause();bt.textContent='▶'}};
  au.ontimeupdate=function(){var n=Math.floor((au.currentTime/(au.duration||sec||1))*bs.length);bs.forEach(function(e,i){e.classList.toggle('on',i<n)})};
  au.onended=function(){bt.textContent='▶';bs.forEach(function(e){e.classList.remove('on')})};
  b.appendChild(v);log.appendChild(b);down()}
async function sendVoice(b){if(b.size<1500)return;var w;try{w=await wav(b)}catch(_){w={blob:b,sec:0,peaks:null}}
  voiceBubble(URL.createObjectURL(w.blob),w.sec,w.peaks);ask('',{mime:(w.blob.type||'audio/webm').split(';')[0],data:await b64(w.blob)})}
function meter(st){mctx=new(window.AudioContext||window.webkitAudioContext)();var an=mctx.createAnalyser();an.fftSize=256;mctx.createMediaStreamSource(st).connect(an);
  var d=new Uint8Array(an.fftSize),lv=new Array(24).fill(.06),n=0;t0=Date.now();
  (function loop(){an.getByteTimeDomainData(d);var m=0;for(var i=0;i<d.length;i++){var x=(d[i]-128)/128;m+=x*x}m=Math.sqrt(m/d.length);
    if(++n%3===0){lv.push(Math.min(1,m*6));lv.shift()}
    for(var i=0;i<24;i++)rb[i].style.height=(5+lv[i]*28)+'px';tm.textContent=fmt((Date.now()-t0)/1000);raf=requestAnimationFrame(loop)})()}
mic.onclick=async function(){
  if(rec&&rec.state==='recording'){rec.stop();return}
  if(busy)return;
  try{var st=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(st);
    rec.ondataavailable=function(e){chunks.push(e.data)};
    rec.onstop=function(){st.getTracks().forEach(function(t){t.stop()});cancelAnimationFrame(raf);try{mctx.close()}catch(_){}fld.classList.remove('recing');clearTimeout(recT);sendVoice(new Blob(chunks,{type:rec.mimeType||'audio/webm'}))};
    rec.start();fld.classList.add('recing');meter(st);recT=setTimeout(function(){if(rec&&rec.state==='recording')rec.stop()},60000)}
  catch(e){ta.placeholder='ما گدرت أفتح المايك. اسمح للموقع باستخدامه'}};
